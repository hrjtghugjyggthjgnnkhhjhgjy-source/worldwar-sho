<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEX</title>
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- صفحه خوش‌آمدگویی -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="globe-container">
            <div class="globe">
                <div class="globe-inner"></div>
                <div class="globe-ring ring1"></div>
                <div class="globe-ring ring2"></div>
            </div>
            <div class="globe-shadow"></div>
        </div>
        <h1 class="nex-title">NEX</h1>
        <p class="nex-subtitle">آینده ارتباطات در دستان شما</p>
        <button class="start-btn" onclick="startApp()">ورود به برنامه</button>
    </div>

    <!-- اپلیکیشن اصلی -->
    <div class="app-container" id="appContainer">
        
        <!-- هدر -->
        <div class="app-header" id="mainHeader">
            <div class="header-menu-btn"><i class="fas fa-bars"></i></div>
            <h2 class="header-logo">NEX</h2>
            <div class="header-search-btn"><i class="fas fa-search"></i></div>
        </div>

        <div class="tab-content">
            <!-- تب چت‌ها -->
            <div class="tab-pane active" id="tab-chats">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="جستجوی گفتگوها">
                </div>

                <!-- لیست چت‌ها -->
                <div class="chat-list" id="mainChatList">
                    <!-- چت تیم NEX (خودکار) -->
                    <div class="chat-item" onclick="openChat('تیم NEX', 'nex')">
                        <div class="chat-avatar bg-blue"><i class="fas fa-check"></i></div>
                        <div class="chat-info">
                            <div class="chat-top">
                                <h4>تیم NEX <i class="fas fa-check-circle verified-badge" style="font-size:12px;"></i></h4>
                                <span class="chat-time">اکنون</span>
                            </div>
                            <p>به پیام‌رسان NEX خوش آمدید...</p>
                        </div>
                    </div>

                    <!-- چت پیام‌های ذخیره شده -->
                    <div class="chat-item" onclick="openChat('پیام‌های ذخیره شده', 'saved')">
                        <div class="chat-avatar bg-green"><i class="fas fa-bookmark"></i></div>
                        <div class="chat-info">
                            <div class="chat-top">
                                <h4>پیام‌های ذخیره شده</h4>
                            </div>
                            <p>اینجا فضای شخصی شماست.</p>
                        </div>
                    </div>

                    <!-- چت رفیق (تستی) -->
                    <div class="chat-item" onclick="openChat('رفیق', 'normal')">
                        <div class="chat-avatar bg-red"><i class="fas fa-user"></i></div>
                        <div class="chat-info">
                            <div class="chat-top">
                                <h4>رفیق</h4>
                                <span class="chat-time">دیروز</span>
                            </div>
                            <p>سلام بچه‌ها...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تب پروفایل -->
            <div class="tab-pane" id="tab-profile">
                <div class="profile-header-bale">
                    <div class="profile-avatar-bale">
                        <i class="fas fa-user"></i>
                        <div class="edit-icon"><i class="fas fa-pencil-alt"></i></div>
                    </div>
                    <h3 class="profile-name-bale" id="profileNameDisplay">کاربر نکس <i class="fas fa-check-circle verified-badge"></i></h3>
                    <p class="profile-id-bale">@NexUser | +98 912 *** ****</p>
                </div>
                
                <div class="settings-list-bale">
                    <div class="setting-item-bale">
                        <div class="setting-icon-bale"><i class="far fa-user"></i></div>
                        <span>حساب کاربری</span>
                    </div>
                    <div class="setting-item-bale">
                        <div class="setting-icon-bale"><i class="fas fa-cog"></i></div>
                        <span>تنظیمات</span>
                    </div>
                    <div class="setting-item-bale" onclick="logout()">
                        <div class="setting-icon-bale" style="color: #ff3b30;"><i class="fas fa-sign-out-alt"></i></div>
                        <span style="color: #ff3b30;">خروج از حساب</span>
                    </div>
                </div>
                <div class="app-version-bale">
                    <span>NEX نسخه ۱.۰.۰</span>
                    <i class="fas fa-check-circle"></i>
                </div>
            </div>
        </div>

        <!-- محیط چت -->
        <div class="chat-room" id="chatRoom">
            <div class="chat-room-header">
                <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-right"></i></button>
                <h4 id="chatRoomTitle">چت</h4>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-area">
                <div class="chat-input-container">
                    <button class="icon-btn"><i class="fas fa-smile"></i></button>
                    <input type="text" id="messageInput" class="message-input" placeholder="پیام..." autocomplete="off">
                    <button class="icon-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
                    <button class="icon-btn send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- منوی پایین -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-chats" onclick="switchTab('chats')">
                <i class="fas fa-comment-dots"></i><span>گفتگوها</span>
            </div>
            <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
                <i class="fas fa-user-circle"></i><span>پروفایل</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
