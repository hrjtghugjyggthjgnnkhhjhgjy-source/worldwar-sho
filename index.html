<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaChat</title>
    <meta name="color-scheme" content="dark">
    <!-- آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            height: 100dvh; width: 100vw; overflow: hidden;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), 
                        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            color: white;
        }

        /* --- 1. صفحه خوش‌آمدگویی --- */
        .welcome-screen {
            position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px); transition: opacity 0.5s ease;
        }
        .welcome-logo {
            width: 90px; height: 90px; background: linear-gradient(135deg, #0078ff, #00d2ff);
            border-radius: 25px; display: flex; align-items: center; justify-content: center;
            font-size: 45px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0, 120, 255, 0.4);
        }
        .welcome-screen h1 { font-size: 26px; margin-bottom: 10px; }
        .welcome-screen p { color: #a0a0a0; font-size: 14px; margin-bottom: 40px; text-align: center; }
        .start-btn {
            background: #0078ff; color: white; border: none; padding: 15px 50px;
            border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .start-btn:hover { background: #0056b3; transform: scale(1.05); }

        /* --- اپلیکیشن اصلی --- */
        .app-container { display: none; height: 100%; flex-direction: column; }

        /* هدر اپلیکیشن */
        .app-header {
            background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(10px);
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10;
        }
        .app-header h2 { font-size: 18px; }

        /* محتوای تب‌ها */
        .tab-content { flex-grow: 1; overflow-y: auto; position: relative; padding-bottom: 70px; }
        .tab-pane { display: none; height: 100%; flex-direction: column; }
        .tab-pane.active { display: flex; }

        /* --- تب چت‌ها --- */
        .chat-list { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .chat-item {
            display: flex; align-items: center; background: rgba(40, 40, 40, 0.5);
            padding: 15px; border-radius: 15px; cursor: pointer; transition: 0.2s;
        }
        .chat-item:hover { background: rgba(60, 60, 60, 0.6); }
        .avatar {
            width: 50px; height: 50px; border-radius: 50%; background: #0078ff;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            margin-left: 15px;
        }
        .chat-info h4 { font-size: 16px; margin-bottom: 5px; }
        .chat-info p { font-size: 12px; color: #a0a0a0; }

        /* --- محیط چت (مخفی تا وقتی کلیک شه) --- */
        .chat-room {
            position: absolute; inset: 0; z-index: 20; display: none;
            flex-direction: column; background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000&auto=format&fit=crop') center/cover;
            background-color: rgba(0,0,0,0.8); background-blend-mode: overlay;
        }
        .chat-room-header {
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px);
            padding: 15px; display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.5; backdrop-filter: blur(5px); animation: fadeIn 0.3s ease; }
        .msg-received { background: rgba(50, 50, 50, 0.8); align-self: flex-start; border-bottom-right-radius: 2px; }
        .msg-sent { background: rgba(0, 120, 255, 0.8); align-self: flex-end; border-bottom-left-radius: 2px; }

        .chat-input-area { padding: 10px 15px; background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .chat-input-container {
            display: flex; align-items: center; background: rgba(40, 40, 40, 0.8);
            backdrop-filter: blur(10px); border-radius: 50px; padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .message-input { flex-grow: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px; padding: 0 10px; }
        .icon-btn { background: transparent; border: none; color: #b0b0b0; font-size: 20px; cursor: pointer; padding: 5px; }
        .send-btn { display: none; background: #0078ff; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; align-items: center; justify-content: center; }

        /* --- تب پروفایل --- */
        .profile-content { padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
        .profile-avatar {
            width: 100px; height: 100px; border-radius: 50%; background: #0078ff;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            margin-bottom: 20px; border: 3px solid rgba(255,255,255,0.2);
        }
        .profile-name-input {
            background: rgba(40, 40, 40, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 12px 20px; border-radius: 10px; font-size: 16px;
            width: 100%; max-width: 300px; text-align: center; margin-bottom: 20px; outline: none;
        }
        .settings-list { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 10px; }
        .setting-item {
            background: rgba(40, 40, 40, 0.5); padding: 15px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }

        /* --- نوار پایین (منو) --- */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; height: 65px;
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05); z-index: 15;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; color: #666;
            cursor: pointer; transition: 0.3s; font-size: 12px; gap: 5px;
        }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: #0078ff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- 1. صفحه خوش‌آمدگویی -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">💬</div>
        <h1>NovaChat</h1>
        <p>ارتباط امن، سریع و مدرن.<br>برای شروع سفر خود کلیک کنید.</p>
        <button class="start-btn" onclick="startApp()">ورود به اپلیکیشن</button>
    </div>

    <!-- 2. اپلیکیشن اصلی -->
    <div class="app-container" id="appContainer">
        
        <!-- هدر اصلی -->
        <div class="app-header" id="mainHeader">
            <h2 id="headerTitle">چت‌ها</h2>
            <i class="fas fa-search" style="color: #a0a0a0;"></i>
        </div>

        <!-- محتوای تب‌ها -->
        <div class="tab-content">
            
            <!-- تب چت‌ها -->
            <div class="tab-pane active" id="tab-chats">
                <div class="chat-list">
                    <div class="chat-item" onclick="openChat('رفیق')">
                        <div class="avatar">👤</div>
                        <div class="chat-info">
                            <h4>رفیق</h4>
                            <p>آخرین پیام...</p>
                        </div>
                    </div>
                    <div class="chat-item">
                        <div class="avatar" style="background: #ff4757;">گ</div>
                        <div class="chat-info">
                            <h4>گروه دوستان</h4>
                            <p>امیر: سلام بچه‌ها</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تب پروفایل -->
            <div class="tab-pane" id="tab-profile">
                <div class="profile-content">
                    <div class="profile-avatar" id="profileAvatar">👤</div>
                    <input type="text" class="profile-name-input" id="profileNameInput" placeholder="نام خود را وارد کنید" value="کاربر نوا">
                    <div class="settings-list">
                        <div class="setting-item">
                            <span>اعلان‌ها</span>
                            <i class="fas fa-chevron-left"></i>
                        </div>
                        <div class="setting-item">
                            <span>حریم خصوصی</span>
                            <i class="fas fa-chevron-left"></i>
                        </div>
                        <div class="setting-item" style="color: #ff4757;" onclick="logout()">
                            <span>خروج از حساب</span>
                            <i class="fas fa-sign-out-alt"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- محیط چت (داخل تب چت باز میشه) -->
        <div class="chat-room" id="chatRoom">
            <div class="chat-room-header">
                <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-right"></i></button>
                <h4 id="chatRoomTitle">رفیق</h4>
            </div>
            <div class="chat-messages" id="chatBox">
                <!-- پیام‌ها اینجا میان -->
            </div>
            <div class="chat-input-area">
                <div class="chat-input-container">
                    <button class="icon-btn"><i class="fas fa-smile"></i></button>
                    <input type="text" id="messageInput" class="message-input" placeholder="پیام..." autocomplete="off">
                    <button class="icon-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
                    <button class="icon-btn send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- منوی پایین -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-chats" onclick="switchTab('chats')">
                <i class="fas fa-comment-dots"></i>
                <span>چت‌ها</span>
            </div>
            <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
                <i class="fas fa-user"></i>
                <span>پروفایل</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. مدیریت صفحه خوش‌آمدگویی ---
        const welcomeScreen = document.getElementById('welcomeScreen');
        const appContainer = document.getElementById('appContainer');

        function startApp() {
            localStorage.setItem('novaUser', 'true');
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                appContainer.style.display = 'flex';
            }, 500);
        }

        if (localStorage.getItem('novaUser')) {
            welcomeScreen.style.display = 'none';
            appContainer.style.display = 'flex';
        }

        // --- 2. مدیریت تب‌ها (چت و پروفایل) ---
        function switchTab(tabName) {
            // مخفی کردن همه تب‌ها
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            // نمایش تب انتخاب شده
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            
            // تغییر عنوان هدر
            document.getElementById('headerTitle').textContent = tabName === 'chats' ? 'چت‌ها' : 'پروفایل';
            
            // بستن چت اگر باز است
            closeChat();
        }

        // --- 3. مدیریت محیط چت ---
        const chatRoom = document.getElementById('chatRoom');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');

        function openChat(name) {
            document.getElementById('chatRoomTitle').textContent = name;
            chatRoom.style.display = 'flex';
            chatBox.innerHTML = '<div class="message msg-received">سلام! این یک پیام تستی است.</div>'; // پاک کردن پیام‌های قبلی
        }

        function closeChat() {
            chatRoom.style.display = 'none';
        }

        // منطق ارسال پیام
        messageInput.addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                sendBtn.style.display = 'flex';
                micBtn.style.display = 'none';
            } else {
                sendBtn.style.display = 'none';
                micBtn.style.display = 'flex';
            }
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '') return;

            const newMsg = document.createElement('div');
            newMsg.classList.add('message', 'msg-sent');
            newMsg.textContent = text;
            chatBox.appendChild(newMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            messageInput.value = '';
            sendBtn.style.display = 'none';
            micBtn.style.display = 'flex';

            // پاسخ خودکار
            setTimeout(() => {
                const replyMsg = document.createElement('div');
                replyMsg.classList.add('message', 'msg-received');
                replyMsg.textContent = "پیامت رسید! (پاسخ خودکار)";
                chatBox.appendChild(replyMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1500);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // --- 4. مدیریت پروفایل ---
        const profileNameInput = document.getElementById('profileNameInput');
        const profileAvatar = document.getElementById('profileAvatar');

        // لود کردن نام از حافظه
        if (localStorage.getItem('novaUserName')) {
            profileNameInput.value = localStorage.getItem('novaUserName');
        }

        // ذخیره نام هنگام تایپ
        profileNameInput.addEventListener('input', function() {
            localStorage.setItem('novaUserName', this.value);
        });

        // دکمه خروج
        function logout() {
            localStorage.removeItem('novaUser');
            location.reload(); // رفرش صفحه برای بازگشت به حالت اول
        }
    </script>
</body>
                        </html>
