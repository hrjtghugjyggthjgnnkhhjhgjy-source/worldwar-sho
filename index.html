<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEX</title>
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- صفحه خوش‌آمدگویی (Splash Screen) -->
    <div class="welcome-screen" id="welcomeScreen">
        
        <!-- لوگوی کره جهانی NEX -->
        <div class="globe-container">
            <div class="globe">
                <div class="globe-inner"></div>
                <div class="globe-ring ring1"></div>
                <div class="globe-ring ring2"></div>
            </div>
            <div class="globe-shadow"></div>
        </div>
        
        <h1 class="nex-title">NEX</h1>
        <p class="nex-subtitle">آینده ارتباطات در دستان شما</p>
        
        <button class="start-btn" onclick="startApp()">ورود به برنامه</button>
    </div>

    <!-- اپلیکیشن اصلی -->
    <div class="app-container" id="appContainer">
        
        <!-- هدر (شبیه تلگرام) -->
        <div class="app-header" id="mainHeader">
            <div class="header-menu-btn"><i class="fas fa-bars"></i></div>
            <h2 class="header-logo">NEX</h2>
            <div class="header-search-btn"><i class="fas fa-search"></i></div>
        </div>

        <div class="tab-content">
            <!-- تب چت‌ها -->
            <div class="tab-pane active" id="tab-chats">
                <div class="chat-list">
                    <div class="chat-item" onclick="openChat('رفیق')">
                        <div class="chat-avatar bg-blue">👤</div>
                        <div class="chat-info">
                            <div class="chat-top">
                                <h4>رفیق</h4>
                                <span class="chat-time">10:30</span>
                            </div>
                            <p>آخرین پیام...</p>
                        </div>
                    </div>
                    
                    <div class="chat-item">
                        <div class="chat-avatar bg-red">گ</div>
                        <div class="chat-info">
                            <div class="chat-top">
                                <h4>گروه دوستان</h4>
                                <span class="chat-time">دیروز</span>
                            </div>
                            <p>امیر: سلام بچه‌ها</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تب پروفایل (تنظیمات) -->
            <div class="tab-pane" id="tab-profile">
                <div class="profile-content">
                    <div class="profile-card">
                        <div class="profile-avatar" id="profileAvatar">👤</div>
                        <input type="text" class="profile-name-input" id="profileNameInput" placeholder="نام خود را وارد کنید" value="کاربر نکس">
                        <p class="profile-phone">+98 912 *** ****</p>
                    </div>
                    
                    <div class="settings-list">
                        <div class="setting-item">
                            <div class="setting-right">
                                <div class="setting-icon bg-blue"><i class="fas fa-user-edit"></i></div>
                                <div class="setting-text"><span>ویرایش پروفایل</span></div>
                            </div>
                            <i class="fas fa-chevron-left setting-arrow"></i>
                        </div>

                        <div class="setting-item">
                            <div class="setting-right">
                                <div class="setting-icon bg-green"><i class="fas fa-bell"></i></div>
                                <div class="setting-text"><span>اعلان‌ها و صدا</span></div>
                            </div>
                            <i class="fas fa-chevron-left setting-arrow"></i>
                        </div>

                        <div class="setting-item">
                            <div class="setting-right">
                                <div class="setting-icon bg-orange"><i class="fas fa-lock"></i></div>
                                <div class="setting-text"><span>حریم خصوصی و امنیت</span></div>
                            </div>
                            <i class="fas fa-chevron-left setting-arrow"></i>
                        </div>

                        <div class="setting-item logout-item" onclick="logout()">
                            <div class="setting-right">
                                <div class="setting-icon bg-red"><i class="fas fa-sign-out-alt"></i></div>
                                <div class="setting-text"><span style="color: #ff3b30;">خروج از حساب</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- محیط چت -->
        <div class="chat-room" id="chatRoom">
            <div class="chat-room-header">
                <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-right"></i></button>
                <h4 id="chatRoomTitle">رفیق</h4>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-area">
                <div class="chat-input-container">
                    <button class="icon-btn"><i class="fas fa-smile"></i></button>
                    <input type="text" id="messageInput" class="message-input" placeholder="پیام..." autocomplete="off">
                    <button class="icon-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
                    <button class="icon-btn send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- منوی پایین شیشه‌ای -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-chats" onclick="switchTab('chats')">
                <i class="fas fa-comment-dots"></i>
                <span>گفتگوها</span>
            </div>
            <div class="nav-item" id="nav-contacts">
                <i class="fas fa-user-friends"></i>
                <span>مخاطبین</span>
            </div>
            <div class="nav-item" id="nav-settings">
                <i class="fas fa-cog"></i>
                <span>تنظیمات</span>
            </div>
            <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
                <i class="fas fa-user-circle"></i>
                <span>پروفایل</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
