<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پیام‌رسان نکس</title>
    <meta name="color-scheme" content="dark">
    
    <!-- لینک به فایل CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 1. صفحه خوش‌آمدگویی -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">💬</div>
        <h1>به پیام‌رسان نکس خوش آمدید</h1>
        <p>ارتباط امن، سریع و مدرن.<br>برای شروع سفر خود کلیک کنید.</p>
        <button class="start-btn" onclick="startApp()">ورود به نکس</button>
    </div>

    <!-- 2. اپلیکیشن اصلی -->
    <div class="app-container" id="appContainer">
        
        <div class="app-header" id="mainHeader">
            <h2 id="headerTitle">چت‌ها</h2>
            <i class="fas fa-search" style="color: #a0a0a0;"></i>
        </div>

        <div class="tab-content">
            <!-- تب چت‌ها -->
            <div class="tab-pane active" id="tab-chats">
                <div class="chat-list">
                    <div class="chat-item" onclick="openChat('رفیق')">
                        <div class="avatar">👤</div>
                        <div class="chat-info">
                            <h4>رفیق</h4>
                            <p>آخرین پیام...</p>
                        </div>
                    </div>
                    <div class="chat-item">
                        <div class="avatar" style="background: #ff4757;">گ</div>
                        <div class="chat-info">
                            <h4>گروه دوستان</h4>
                            <p>امیر: سلام بچه‌ها</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تب پروفایل -->
            <div class="tab-pane" id="tab-profile">
                <div class="profile-content">
                    <div class="profile-avatar" id="profileAvatar">👤</div>
                    <input type="text" class="profile-name-input" id="profileNameInput" placeholder="نام خود را وارد کنید" value="کاربر نکس">
                    <div class="settings-list">
                        <div class="setting-item">
                            <span>اعلان‌ها</span>
                            <i class="fas fa-chevron-left"></i>
                        </div>
                        <div class="setting-item">
                            <span>حریم خصوصی</span>
                            <i class="fas fa-chevron-left"></i>
                        </div>
                        <div class="setting-item" style="color: #ff4757;" onclick="logout()">
                            <span>خروج از حساب</span>
                            <i class="fas fa-sign-out-alt"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- محیط چت -->
        <div class="chat-room" id="chatRoom">
            <div class="chat-room-header">
                <button class="back-btn" onclick="closeChat()"><i class="fas fa-arrow-right"></i></button>
                <h4 id="chatRoomTitle">رفیق</h4>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-area">
                <div class="chat-input-container">
                    <button class="icon-btn"><i class="fas fa-smile"></i></button>
                    <input type="text" id="messageInput" class="message-input" placeholder="پیام..." autocomplete="off">
                    <button class="icon-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
                    <button class="icon-btn send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- منوی پایین -->
        <div class="bottom-nav">
            <div class="nav-item active" id="nav-chats" onclick="switchTab('chats')">
                <i class="fas fa-comment-dots"></i>
                <span>چت‌ها</span>
            </div>
            <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
                <i class="fas fa-user"></i>
                <span>پروفایل</span>
            </div>
        </div>
    </div>

    <!-- لینک به فایل جاوااسکریپت -->
    <script src="script.js"></script>
</body>
</html>
